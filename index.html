```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Shuttu ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #050509;
    color: white;
}

.screen {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* OPENING */

.opening-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        radial-gradient(circle at center, #201020 0%, #09070c 45%, #020204 100%);
}

.opening-content {
    width: 90%;
    max-width: 650px;
    animation: fadeIn 2s ease;
}

.small-text {
    font-size: 14px;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 25px;
}

.name {
    font-size: clamp(45px, 10vw, 90px);
    font-weight: 300;
    letter-spacing: 4px;
    margin-bottom: 25px;
}

.heart {
    color: #ff4d88;
    font-size: 45px;
    animation: heartbeat 1.5s infinite;
    display: inline-block;
}

.opening-message {
    margin: 30px auto;
    line-height: 1.8;
    font-size: 18px;
    opacity: 0.75;
}

.main-button,
.chapter-button {
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06);
    color: white;
    padding: 15px 30px;
    border-radius: 40px;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.4s ease;
    backdrop-filter: blur(10px);
}

.main-button:hover,
.chapter-button:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.05);
    border-color: rgba(255,255,255,0.5);
}

/* ACCESS */

.access-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        radial-gradient(circle, #151525 0%, #050509 60%);
}

.access-content {
    animation: accessAppear 2s ease;
}

.access-icon {
    font-size: 55px;
    margin-bottom: 25px;
    animation: pulse 2s infinite;
}

.access-title {
    font-size: 13px;
    letter-spacing: 6px;
    opacity: 0.5;
    margin-bottom: 15px;
}

.access-name {
    font-size: 40px;
    letter-spacing: 5px;
    margin-bottom: 30px;
}

.loading {
    width: 220px;
    height: 2px;
    background: rgba(255,255,255,0.1);
    margin: auto;
    overflow: hidden;
}

.loading-bar {
    height: 100%;
    width: 0%;
    background: #ff4d88;
    animation: loading 2.5s forwards;
}

/* SECOND SCREEN */

.next-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        radial-gradient(circle at center, #24101e 0%, #08060b 55%, #020204 100%);
}

.next-content {
    width: 90%;
    max-width: 700px;
    animation: fadeIn 2s ease;
}

.connection {
    font-size: 11px;
    letter-spacing: 5px;
    opacity: 0.4;
    margin-bottom: 30px;
}

.next-name {
    font-size: clamp(45px, 9vw, 80px);
    font-weight: 300;
    letter-spacing: 8px;
    margin-bottom: 20px;
}

.next-heart {
    font-size: 55px;
    color: #ff4d88;
    animation: heartbeat 1.5s infinite;
    display: inline-block;
    margin-bottom: 30px;
}

.next-message {
    font-size: 19px;
    line-height: 1.8;
    opacity: 0.7;
    margin-bottom: 35px;
}

/* CHAPTER */

.chapter-screen {
    background:
        radial-gradient(circle at center, #171022 0%, #050509 65%, #010102 100%);
}

.chapter {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 90%;
    max-width: 750px;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
    animation: chapterAppear 1.5s ease;
}

.chapter-number {
    font-size: 11px;
    letter-spacing: 6px;
    opacity: 0.35;
    margin-bottom: 18px;
}

.chapter-title {
    font-size: clamp(35px, 7vw, 65px);
    font-weight: 300;
    letter-spacing: 6px;
    margin-bottom: 25px;
}

.chapter-line {
    width: 60px;
    height: 1px;
    background: rgba(255,255,255,0.4);
    margin: 0 auto 40px;
}

.chapter-text {
    min-height: 120px;
    font-size: clamp(18px, 3vw, 25px);
    line-height: 1.8;
    opacity: 0.8;
    transition: opacity 0.7s ease;
    padding: 0 10px;
}

.chapter-text strong {
    font-weight: 400;
    color: #ff79a8;
}

.chapter-button {
    margin-top: 30px;
}

/* STARS */

.stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle 3s infinite ease-in-out;
}

/* FINAL */

.final-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        radial-gradient(circle at center, #301020 0%, #0a050b 55%, #020204 100%);
}

.final-content {
    width: 90%;
    max-width: 800px;
    animation: finalAppear 2s ease;
}

.final-label {
    font-size: 11px;
    letter-spacing: 7px;
    opacity: 0.4;
    margin-bottom: 25px;
}

.final-name {
    font-size: clamp(50px, 11vw, 100px);
    font-weight: 300;
    letter-spacing: 5px;
    margin-bottom: 35px;
}

.final-message {
    font-size: clamp(19px, 3vw, 27px);
    line-height: 2;
    opacity: 0.8;
}

.final-message strong {
    color: #ff6f9f;
    font-weight: 400;
}

.final-heart {
    margin-top: 35px;
    font-size: 60px;
    color: #ff4d88;
    animation: heartbeat 1.5s infinite;
}

/* ANIMATIONS */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes accessAppear {

    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

@keyframes chapterAppear {

    from {
        opacity: 0;
        transform: translate(-50%, -45%);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%);
    }

}

@keyframes finalAppear {

    from {
        opacity: 0;
        transform: scale(0.92);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

@keyframes heartbeat {

    0% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.15);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.12);
    }

    60% {
        transform: scale(1);
    }

}

@keyframes pulse {

    0% {
        opacity: 0.5;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.08);
    }

    100% {
        opacity: 0.5;
        transform: scale(1);
    }

}

@keyframes loading {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }

}

@keyframes twinkle {

    0% {
        opacity: 0.1;
        transform: scale(0.7);
    }

    50% {
        opacity: 0.8;
        transform: scale(1.3);
    }

    100% {
        opacity: 0.1;
        transform: scale(0.7);
    }

}

/* MOBILE */

@media (max-width: 600px) {

    .opening-message,
    .next-message {
        font-size: 16px;
    }

    .chapter-text {
        font-size: 18px;
    }

    .chapter-title {
        letter-spacing: 3px;
    }

    .next-name {
        letter-spacing: 4px;
    }

}

</style>
</head>

<body>

<!-- MUSIC -->

<audio id="music" loop>
    <source src="music/Audio.mp3" type="audio/mpeg">
</audio>


<!-- OPENING SCREEN -->

<div class="screen opening-screen" id="mainScreen">

    <div class="opening-content">

        <div class="small-text">
            Someone made this just for you...
        </div>

        <div class="name">
            Shuttu
        </div>

        <div class="heart">
            ❤️
        </div>

        <div class="opening-message">
            Before you continue...<br>
            I have something I want you to see.
        </div>

        <button class="main-button" onclick="startStory()">
            ENTER MY LITTLE WORLD ✨
        </button>

    </div>

</div>


<script>

/* ==========================================
   START STORY
========================================== */

function startStory() {

    const music = document.getElementById("music");

    music.play().catch(function(error) {
        console.log("Music could not start:", error);
    });

    const screen = document.getElementById("mainScreen");

    screen.className = "screen access-screen";

    screen.innerHTML = `

        <div class="access-content">

            <div class="access-icon">
                ❤️
            </div>

            <div class="access-title">
                CONNECTION ESTABLISHED
            </div>

            <div class="access-name">
                SHUTTU
            </div>

            <div class="loading">
                <div class="loading-bar"></div>
            </div>

        </div>

    `;

    setTimeout(function() {
        showNextScene();
    }, 3000);
}


/* ==========================================
   SECOND SCREEN
========================================== */

function showNextScene() {

    const screen = document.getElementById("mainScreen");

    screen.className = "screen next-screen";

    screen.innerHTML = `

        <div class="next-content">

            <div class="connection">
                CONNECTION ESTABLISHED
            </div>

            <div class="next-name">
                SHUTTU
            </div>

            <div class="next-heart">
                ❤️
            </div>

            <div class="next-message">
                There is a little story<br>
                I want you to see...
            </div>

            <button class="main-button" onclick="nextChapter()">
                CONTINUE →
            </button>

        </div>

    `;
}


/* ==========================================
   CHAPTER 01
========================================== */

function nextChapter() {

    const screen = document.getElementById("mainScreen");

    screen.className = "screen chapter-screen";

    screen.innerHTML = `

        <div class="stars" id="stars"></div>

        <div class="chapter">

            <div class="chapter-number">
                CHAPTER 01
            </div>

            <div class="chapter-title">
                THE BEGINNING
            </div>

            <div class="chapter-line"></div>

            <div class="chapter-text" id="chapterText">
                Before you came into my life...
            </div>

            <button class="chapter-button" onclick="chapterOneNext()">
                CONTINUE →
            </button>

        </div>

    `;

    createStars();

}


/* ==========================================
   CHAPTER 01 NEXT
========================================== */

function chapterOneNext() {

    const text = document.getElementById("chapterText");

    const step = text.dataset.step || "1";

    text.style.opacity = "0";

    setTimeout(function() {

        if (step === "1") {

            text.innerHTML =
                "I thought I knew what happiness looked like...";

            text.dataset.step = "2";

        }

        else if (step === "2") {

            text.innerHTML =
                "Then somehow... you appeared.";

            text.dataset.step = "3";

        }

        else if (step === "3") {

            text.innerHTML =
                "And slowly, without even realizing it...<br><br><strong>you became my favorite part of every day.</strong>";

            text.dataset.step = "4";

        }

        else {

            nextChapterTwo();
            return;

        }

        text.style.opacity = "0.9";

    }, 600);

}


/* ==========================================
   CHAPTER 02
========================================== */

function nextChapterTwo() {

    const screen = document.getElementById("mainScreen");

    screen.className = "screen chapter-screen";

    screen.innerHTML = `

        <div class="stars" id="starsTwo"></div>

        <div class="chapter">

            <div class="chapter-number">
                CHAPTER 02
            </div>

            <div class="chapter-title">
                THEN YOU
            </div>

            <div class="chapter-line"></div>

            <div class="chapter-text" id="chapterTwoText">
                Your smile.
            </div>

            <button class="chapter-button" onclick="chapterTwoNext()">
                CONTINUE →
            </button>

        </div>

    `;

    createStarsFor("starsTwo");

}


/* ==========================================
   CHAPTER 02 NEXT
========================================== */

function chapterTwoNext() {

    const text = document.getElementById("chapterTwoText");

    const step = text.dataset.step || "1";

    text.style.opacity = "0";

    setTimeout(function() {

        if (step === "1") {

            text.innerHTML = "Your voice.";

            text.dataset.step = "2";

        }

        else if (step === "2") {

            text.innerHTML = "Your little habits.";

            text.dataset.step = "3";

        }

        else if (step === "3") {

            text.innerHTML =
                "The way you make ordinary days feel special.";

            text.dataset.step = "4";

        }

        else if (step === "4") {

            text.innerHTML =
                "And somehow... it became impossible to imagine my world without you. ❤️";

            text.dataset.step = "5";

        }

        else {

            nextChapterThree();
            return;

        }

        text.style.opacity = "0.9";

    }, 600);

}


/* ==========================================
   CHAPTER 03
========================================== */

function nextChapterThree() {

    const screen = document.getElementById("mainScreen");

    screen.className = "screen chapter-screen";

    screen.innerHTML = `

        <div class="stars" id="starsThree"></div>

        <div class="chapter">

            <div class="chapter-number">
                CHAPTER 03
            </div>

            <div class="chapter-title">
                ONE QUESTION
            </div>

            <div class="chapter-line"></div>

            <div class="chapter-text">

                If you could choose one person<br>
                to stay beside you through<br>
                all the chapters ahead...<br><br>

                <strong>Who would you choose?</strong>

            </div>

            <button class="chapter-button" onclick="finalAnswer()">
                I KNOW ❤️
            </button>

        </div>

    `;

    createStarsFor("starsThree");

}


/* ==========================================
   FINAL CHAPTER
========================================== */

function finalAnswer() {

    const screen = document.getElementById("mainScreen");

    screen.className = "screen final-screen";

    screen.innerHTML = `

        <div class="stars" id="finalStars"></div>

        <div class="final-content">

            <div class="final-label">
                FINAL CHAPTER
            </div>

            <div class="final-name">
                Shuttu...
            </div>

            <div class="final-message">

                If I could choose one person<br>
                to laugh with,<br>
                grow with,<br>
                travel with,<br>
                annoy forever...

                <br><br>

                <strong>
                    I'd choose you. ❤️
                </strong>

            </div>

            <div class="final-heart">
                ❤️
            </div>

        </div>

    `;

    createStarsFor("finalStars");

}


/* ==========================================
   CREATE STARS
========================================== */

function createStars() {

    createStarsFor("stars");

}


function createStarsFor(containerId) {

    const container = document.getElementById(containerId);

    if (!container) {
        return;
    }

    for (let i = 0; i < 100; i++) {

        const star = document.createElement("div");

        star.className = "star";

        star.style.left = Math.random() * 100 + "%";

        star.style.top = Math.random() * 100 + "%";

        star.style.animationDelay =
            Math.random() * 3 + "s";

        star.style.opacity =
            Math.random() * 0.7 + 0.1;

        container.appendChild(star);

    }

}

</script>

</body>
</html>
